<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Kitchen Reviews - Dollar Kamao</title>
<meta name="description" content="Every Dollar Kamao kitchen tool review in one place - tested picks for small families, newest first.">
<meta property="og:title" content="All Kitchen Reviews - Dollar Kamao">
<meta property="og:description" content="Every tested kitchen tool review for small families, newest first.">
<meta property="og:url" content="https://dollarkamao.vercel.app/blog/">
<meta property="og:type" content="website">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,#0a0f1c 0%,#0d1626 40%,#0a0f1c 100%);color:#e8edf5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
nav{position:sticky;top:0;z-index:50;background:rgba(10,15,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-inner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{color:#fff;font-weight:800;font-size:19px;text-decoration:none}
.nav-links{display:flex;gap:20px}
.nav-links a{color:#aeb9cc;text-decoration:none;font-size:15px}
.nav-links a.active,.nav-links a:hover{color:#00ff88}
.wide{max-width:1100px;margin:0 auto;padding:0 20px}
h1{text-align:center;color:#fff;font-size:30px;margin:34px 0 6px}
.sec-sub{text-align:center;color:#aeb9cc;margin:0 0 26px;font-size:15px}
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:0 0 50px}
@media(max-width:900px){.rev-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.rev-grid{grid-template-columns:1fr}}
.rev-card{position:relative;display:block;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;text-decoration:none;transition:transform .25s,box-shadow .25s;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rev-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.rev-img{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:#101724}
.rev-img img{width:100%;height:100%;object-fit:cover;display:block}
.new-badge{position:absolute;top:10px;left:10px;background:linear-gradient(90deg,#00ff88,#00d4ff);color:#0a0f1c;font-weight:800;font-size:12px;padding:4px 11px;border-radius:999px;letter-spacing:.4px}
.rev-date{display:block;color:#8a94a8;font-size:12px;margin-bottom:6px}
.rev-body{display:block;padding:14px 16px 18px}
.rev-body b{display:block;color:#fff;font-size:16.5px;line-height:1.35;margin-bottom:8px}
.rev-body p{color:#aeb9cc;font-size:13.5px;line-height:1.5;margin:0 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn-check{display:inline-block;background:linear-gradient(180deg,#ffb84d,#ff9900);color:#1a1000;font-weight:800;font-size:15px;padding:11px 24px;border-radius:12px}
.loading{color:#8a94a8;text-align:center;grid-column:1/-1;padding:20px}
footer{border-top:1px solid rgba(255,255,255,.08);padding:26px 20px;text-align:center;color:#8a94a8;font-size:13px}
footer a{color:#aeb9cc;text-decoration:none;margin:0 8px}
.affil-note{color:#8a94a8;font-size:12px;margin:10px 0 0;text-align:center}
</style>
</head>
<body>
<nav><div class="nav-inner">
<a class="brand" href="../index.html">💰 Dollar Kamao</a>
<div class="nav-links">
<a href="../index.html">Home</a><a href="./" class="active">Blog</a><a href="../about.html">About</a><a href="../contact.html">Contact</a>
</div></div></nav>

<div class="wide">
<h1>📚 All Kitchen Reviews</h1>
<p class="sec-sub">Every tested pick for small families — newest first.</p>
<div class="rev-grid" id="allReviews"><p class="loading">Loading reviews…</p></div>
</div>

<footer>
<a href="../index.html">Home</a>·<a href="./">Blog</a>·<a href="../about.html">About</a>·<a href="../contact.html">Contact</a>·<a href="../privacy.html">Privacy</a>
<p class="affil-note">As an Amazon Associate I earn from qualifying purchases.</p>
<p style="margin-top:10px">© 2026 Dollar Kamao. All rights reserved.</p>
</footer>

<script>
(function(){
var grid=document.getElementById('allReviews');if(!grid)return;
fetch('../blog.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){
  var arts=(d.articles||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var now=new Date();now.setHours(0,0,0,0);
  function fmt(ds){var p=ds.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1]+' '+ +p[2]+', '+p[0];}
  grid.innerHTML=arts.map(function(a,i){
    var age=Math.floor((now-new Date(a.date+'T00:00:00'))/864e5);
    var badge=age<3?'<span class="new-badge">New</span>':'';
    var t=String(a.title).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    var e=String(a.excerpt||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    return '<a class="rev-card" style="animation-delay:'+(i*0.05)+'s" href="'+a.slug+'">'+
      '<span class="rev-img"><img loading="lazy" alt="'+t+'" src="'+a.image+'">'+badge+'</span>'+
      '<span class="rev-body"><span class="rev-date">'+fmt(a.date)+'</span><b>'+t+'</b><p>'+e+'</p><span class="btn-check">Check Price &rarr;</span></span></a>';
  }).join('')||'<p class="loading">Reviews coming soon.</p>';
}).catch(function(){grid.innerHTML='<p class="loading">Reviews coming soon.</p>';});
})();
</script>
</body>
</html>
