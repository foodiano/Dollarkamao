<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tag - Dollar Kamao</title>
<meta name="description" content="Kitchen tool reviews by tag — Dollar Kamao.">
<meta name="robots" content="noindex, follow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,#0a0f1c 0%,#0d1626 40%,#0a0f1c 100%);color:#e8edf5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
nav.top{position:sticky;top:0;z-index:50;background:rgba(10,15,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-inner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{color:#fff;font-weight:800;font-size:19px;text-decoration:none;cursor:pointer}
.nav-links{display:flex;gap:20px}
.nav-links a{color:#aeb9cc;text-decoration:none;font-size:15px;cursor:pointer}
.nav-links a:hover{color:#00ff88}
.wide{max-width:1100px;margin:0 auto;padding:0 20px}
.crumbs{margin:16px 0 0;font-size:13px;color:#8a94a8}
.crumbs a{color:#00ff88;text-decoration:none;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{margin:0 7px;color:#5a6478}
h1{text-align:center;color:#fff;font-size:28px;margin:22px 0 6px}
h1 .hash{color:#00ff88}
.sec-sub{text-align:center;color:#aeb9cc;margin:0 0 26px;font-size:15px}
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:0 0 50px}
@media(max-width:900px){.rev-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.rev-grid{grid-template-columns:1fr}}
.rev-card{position:relative;display:block;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;text-decoration:none;transition:transform .25s,box-shadow .25s;cursor:pointer;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rev-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.rev-card:hover b{text-decoration:underline}
.rev-img{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:#101724}
.rev-img img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.new-badge{position:absolute;top:10px;left:10px;background:linear-gradient(90deg,#00ff88,#00d4ff);color:#0a0f1c;font-weight:800;font-size:12px;padding:4px 11px;border-radius:999px}
.rev-body{display:block;padding:14px 16px 18px}
.rev-body b{display:block;color:#fff;font-size:16.5px;line-height:1.35;margin-bottom:8px;cursor:pointer}
.rev-body p{color:#aeb9cc;font-size:13.5px;line-height:1.5;margin:0 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn-check{display:inline-block;background:linear-gradient(180deg,#ffb84d,#ff9900);color:#1a1000;font-weight:800;font-size:15px;padding:11px 24px;border-radius:12px;cursor:pointer}
.loading{color:#8a94a8;text-align:center;grid-column:1/-1;padding:20px}
footer{border-top:1px solid rgba(255,255,255,.08);padding:26px 20px;text-align:center;color:#8a94a8;font-size:13px}
footer a{color:#aeb9cc;text-decoration:none;margin:0 8px;cursor:pointer}
</style>
</head>
<body>
<nav class="top"><div class="nav-inner">
<a class="brand" href="../index.html">💰 Dollar Kamao</a>
<div class="nav-links">
<a href="../index.html">Home</a><a href="./">Blog</a><a href="../about.html">About</a><a href="../contact.html">Contact</a>
</div></div></nav>

<div class="wide">
<nav class="crumbs"><a href="../index.html">Home</a><span class="sep">›</span><a href="./">Blog</a><span class="sep">›</span><span id="crumbTag">Tag</span></nav>
<h1><span class="hash">#</span><span id="tagName">Tag</span></h1>
<p class="sec-sub" id="tagCount"></p>
<div class="rev-grid" id="tagGrid"><p class="loading">Loading…</p></div>
</div>

<footer>
<a href="../index.html">Home</a>·<a href="./">Blog</a>·<a href="../about.html">About</a>·<a href="../contact.html">Contact</a>
<p style="margin-top:10px">© 2026 Dollar Kamao. All rights reserved.</p>
</footer>

<script>
(function(){
var parts=location.pathname.split('/').filter(Boolean);
var raw=parts[parts.length-1]||'';
var slug=decodeURIComponent(raw).toLowerCase().replace(/[^a-z0-9]+/g,'');
function disp(s){return s.charAt(0).toUpperCase()+s.slice(1);}
document.getElementById('tagName').textContent=disp(slug)||'Tag';
document.getElementById('crumbTag').textContent='#'+disp(slug);
document.title='#'+disp(slug)+' - Dollar Kamao';
var grid=document.getElementById('tagGrid');
fetch('../blog.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){
  var arts=(d.articles||[]).filter(function(a){
    return (a.tags||[]).some(function(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,'')===slug;});
  }).sort(function(a,b){return a.date<b.date?1:-1;});
  var now=new Date();now.setHours(0,0,0,0);
  document.getElementById('tagCount').textContent=arts.length+' review'+(arts.length===1?'':'s')+' tagged #'+disp(slug);
  grid.innerHTML=arts.map(function(a,i){
    var age=Math.floor((now-new Date(a.date+'T00:00:00'))/864e5);
    var badge=age<3?'<span class="new-badge">New</span>':'';
    var t=String(a.title).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    var e=String(a.excerpt||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    var img=a.image?'<img loading="lazy" alt="'+t+'" src="'+a.image+'">':'';
    return '<a class="rev-card" style="animation-delay:'+(i*0.05)+'s" href="../'+a.slug+'">'+
      '<span class="rev-img">'+img+badge+'</span>'+
      '<span class="rev-body"><b>'+t+'</b><p>'+e+'</p><span class="btn-check">Check Price &rarr;</span></span></a>';
  }).join('')||'<p class="loading">No reviews with this tag yet.</p>';
}).catch(function(){grid.innerHTML='<p class="loading">Could not load reviews.</p>';});
})();
</script>
</body>
</html>
