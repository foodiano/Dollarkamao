<div class="container">
<div class="hero">
<h1>Contact</h1>
<p>Questions about web development, this site, or just want to say hi? Send a message below.</p>
</div>

<div class="card">
<form action="https://formsubmit.co/foodiano@gmail.com" method="POST">
<input type="hidden" name="_subject" value="New message from Dollar Kamao">
<input type="hidden" name="_captcha" value="false">
<label for="name">Your name</label>
<input type="text" id="name" name="name" required placeholder="John Doe">
<label for="email">Your email</label>
<input type="email" id="email" name="email" required placeholder="you@example.com">
<label for="message">Message</label>
<textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
<button class="send" type="submit">Send Message</button>
</form>
<p class="small">Or email directly: <a href="mailto:foodiano@gmail.com" style="color:#00ff88">foodiano@gmail.com</a></p>
